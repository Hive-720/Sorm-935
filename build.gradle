plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.grunvald'
version = '1.0.0-SNAPSHOT'

springBoot {
    buildInfo()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    integrationTest {
        java {
            srcDirs = ['src/integrationTest/java']
        }
        resources {
            srcDirs = ['src/integrationTest/resources']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    mavenCentral()
}

dependencies {

    def querydslVersion = "5.1.0"

    //TODO убрать лишнее
    implementation "com.querydsl:querydsl-core:$querydslVersion"
    implementation "com.querydsl:querydsl-sql:$querydslVersion"

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.r2dbc:r2dbc-pool'
    implementation 'io.r2dbc:r2dbc-proxy'
    implementation 'org.springframework:spring-r2dbc'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    implementation 'org.liquibase:liquibase-core'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.graphql-java:graphql-java-extended-validation:24.0'

    implementation 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'
    implementation 'org.postgresql:postgresql'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.jsoup:jsoup:1.21.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    integrationTestImplementation 'io.micrometer:micrometer-core'

}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests'
    group = 'verification'

    useJUnitPlatform()

    systemProperty "spring.profiles.active", "integrationTest"

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    // main.output должен идти ПЕРЕД зависимостями, иначе classpath:-сканирование ресурсов
    // (например, GraphQL-схемы из src/main/resources) натыкается на jar'ы graphql-java
    classpath = sourceSets.integrationTest.output + sourceSets.main.output +
            (sourceSets.integrationTest.runtimeClasspath - sourceSets.main.output)
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
    executionData file("${buildDir}/jacoco/test.exec"), file("${buildDir}/jacoco/integrationTest.exec")
}

tasks.register('testCoverageReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    sourceSets sourceSets.main
    executionData file("${buildDir}/jacoco/test.exec"), file("${buildDir}/jacoco/integrationTest.exec")
    reports {
        xml.required = true
        html.required = true
    }
}