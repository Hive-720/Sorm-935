plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.github.kobylynskyi.graphql.codegen' version '5.9.0'
}

group = 'com.kjsoft'
version = '1.0.0-SNAPSHOT'

springBoot {
    buildInfo()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    integrationTest {
        java {
            srcDirs = ['src/integrationTest/java']
        }
        resources {
            srcDirs = ['src/integrationTest/resources']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

graphqlCodegen {
    graphqlSchemaPaths = [
        "$projectDir/src/main/resources/graphql/schema.graphqls".toString()
    ]
    outputDir = new File("$buildDir/generated/graphql")
    packageName = "com.kjsoft.sorm.graphql.generated"
    modelPackageName = "com.kjsoft.sorm.graphql.generated.model"

    generateImmutableModels = true
    generateEqualsAndHashCode = true
    generateToString = true

    // Сгенерированные выходные типы получат суффикс Gql,
    // чтобы не конфликтовать с ручными типами сущностей
    modelNameSuffix = "Gql"

    // Кастомные маппинги скаляров
    customTypesMapping = [
        "ID"     : "java.lang.Long",
        "Int"    : "java.lang.Integer",
        "Float"  : "java.math.BigDecimal",
        "String" : "java.lang.String",
        "Boolean": "java.lang.Boolean"
    ]

    // Маппинг кастомных директив валидации на Jakarta annotations.
    // Шаблонные переменные {{param}} не поддерживаются в версии плагина 5.9.0,
    // поэтому используются фиксированные значения по умолчанию.
    // Валидация в рантайме не применяется — аннотации носят информационный характер.
    directiveAnnotationsMapping = [
        "Size"           : ["@jakarta.validation.constraints.Size(min = 0, max = 2147483647)"],
        "Pattern"        : ["@jakarta.validation.constraints.Pattern(regexp = \".*\")"],
        "PositiveOrZero" : ["@jakarta.validation.constraints.PositiveOrZero"],
        "Range"          : ["@jakarta.validation.constraints.Min(0)", "@jakarta.validation.constraints.Max(2147483647)"],
        "ContainerSize"  : ["@jakarta.validation.constraints.Size(min = 0, max = 2147483647)"]
    ]

    // Генерировать интерфейсы резолверов с аннотациями Spring GraphQL
    resolverArgumentAnnotations = [
        "org.springframework.graphql.data.method.annotation.Argument"
    ]
    parametrizedResolverAnnotations = [
        "org.springframework.graphql.data.method.annotation.SchemaMapping"
    ]
}

// Подключаем сгенерированные исходники к компиляции (только model-классы, не resolver-ы)
sourceSets.main.java.srcDir "$buildDir/generated/graphql"
sourceSets.main.java {
    exclude 'com/kjsoft/sorm/graphql/generated/*Resolver.java'
}

// Пост-обработка: замена javax на jakarta в сгенерированном коде
tasks.register('fixGeneratedCode') {
    description = 'Replaces javax with jakarta in generated code'
    group = 'codegen'
    inputs.dir "$buildDir/generated/graphql"
    outputs.dir "$buildDir/generated/graphql"
    doLast {
        def generatedDir = file("$buildDir/generated/graphql")
        generatedDir.eachFileRecurse { file ->
            if (file.name.endsWith('.java')) {
                def content = file.text
                def updated = content
                    .replace('javax.validation.constraints', 'jakarta.validation.constraints')
                    .replace('javax.annotation.processing.Generated', 'jakarta.annotation.Generated')
                if (content != updated) {
                    file.text = updated
                }
            }
        }
    }
}

fixGeneratedCode.dependsOn 'graphqlCodegen'
compileJava.dependsOn 'fixGeneratedCode'

repositories {
    mavenCentral()
}

dependencies {

    def querydslVersion = "5.1.0"

    //TODO убрать лишнее
    implementation "com.querydsl:querydsl-core:$querydslVersion"
    implementation "com.querydsl:querydsl-sql:$querydslVersion"

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.r2dbc:r2dbc-pool'
    implementation 'org.springframework:spring-r2dbc'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    implementation 'org.liquibase:liquibase-core'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.graphql-java:graphql-java-extended-validation:24.0'

    implementation 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'
    implementation 'org.postgresql:postgresql'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.jsoup:jsoup:1.21.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers'

}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests'
    group = 'verification'

    useJUnitPlatform()

    systemProperty "spring.profiles.active", "integrationTest"

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}