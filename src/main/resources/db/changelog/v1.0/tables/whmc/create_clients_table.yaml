databaseChangeLog:
  - changeSet:
      id: create_clients_table
      author: iklakotsky
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_group_id
                  type: BIGINT
              - column:
                  name: owner_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(510)
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: company_name
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: address
                  type: VARCHAR(1000)
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: state
                  type: VARCHAR(255)
              - column:
                  name: postcode
                  type: VARCHAR(50)
              - column:
                  name: country
                  type: VARCHAR(255)
              - column:
                  name: msisdn
                  type: VARCHAR(100)
              - column:
                  name: phonecc
                  type: INT
              - column:
                  name: phone_number
                  type: VARCHAR(90)
              - column:
                  name: tax_id
                  type: VARCHAR(100)
              - column:
                  name: telegram
                  type: VARCHAR(255)
              - column:
                  name: jabber
                  type: VARCHAR(255)
              - column:
                  name: currency
                  type: VARCHAR(3)
              - column:
                  name: default_gateway
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: credit
                  type: DECIMAL(19, 2)
              - column:
                  name: tax_exempt
                  type: BOOL
              - column:
                  name: language
                  type: VARCHAR(100)
              - column:
                  name: date_created
                  type: TIMESTAMPTZ
              - column:
                  name: deleted
                  type: BOOL
                  defaultValueBoolean: false