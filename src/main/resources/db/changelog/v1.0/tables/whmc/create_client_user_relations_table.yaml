databaseChangeLog:
  - changeSet:
      id: create_client_user_relations_table
      author: iklakotsky
      changes:
        - createTable:
            tableName: client_user_relations
            columns:
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
        - addPrimaryKey:
            columnNames: client_id, user_id
            constraintName: pk_client_user_relations
            tableName: client_user_relations