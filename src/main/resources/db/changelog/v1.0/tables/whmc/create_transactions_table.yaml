databaseChangeLog:
  - changeSet:
      id: create_transactions_table
      author: iklakotsky
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: invoice_id
                  type: BIGINT
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trans_id
                  type: VARCHAR(255)
              - column:
                  name: refund_id
                  type: BIGINT
              - column:
                  name: currency
                  type: VARCHAR(100)
              - column:
                  name: gateway
                  type: VARCHAR(100)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: amount_in
                  type: DECIMAL(19, 2)
              - column:
                  name: amount_out
                  type: DECIMAL(19, 2)
              - column:
                  name: fees
                  type: DECIMAL(19, 2)
              - column:
                  name: rate
                  type: DECIMAL(19, 6)
              - column:
                  name: date
                  type: TIMESTAMPTZ