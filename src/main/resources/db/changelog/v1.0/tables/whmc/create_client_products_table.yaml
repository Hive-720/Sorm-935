databaseChangeLog:
  - changeSet:
      id: create_client_products_table
      author: iklakotsky
      changes:
        - createTable:
            tableName: client_products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: BIGINT
              - column:
                  name: product_id
                  type: BIGINT
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: reg_date
                  type: TIMESTAMPTZ
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: domain
                  type: VARCHAR(255)
              - column:
                  name: dedicated_ip_address
                  type: VARCHAR(100)
              - column:
                  name: first_payment_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: recurring_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: billing_cycle
                  type: VARCHAR(50)
              - column:
                  name: next_due_date
                  type: TIMESTAMPTZ
              - column:
                  name: assigned_ips
                  type: VARCHAR[]
              - column:
                  name: status
                  type: VARCHAR(100)
              - column:
                  name: last_update
                  type: TIMESTAMPTZ
              - column:
                  name: configs
                  type: JSONB