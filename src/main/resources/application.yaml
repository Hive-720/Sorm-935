server:
  port: 9931

spring:
  application:
    name: sorm-935
  profiles:
    active: dev

management:
  server:
    port: 9990
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        r2dbc.query: true
        sorm.whmcs.api.request: true
        sorm.sync.task.duration: true
      slo:
        http.server.requests: 100ms, 500ms, 2s
        http.client.requests: 100ms, 500ms, 2s
        r2dbc.query: 50ms, 200ms, 1s

sorm:
  security:
    enabled: false
    api-key: testApiKey
    exclude-endpoints:
      - '/actuator/health'
  system:
    notifications:
      errors_graphql_api: true
      errors_api: true
      errors_scheduler: true
      graphql_schema_version_mismatch: true
      reload: true
  graphql:
    schema:
      version_check:
        enabled: true
    api:
      max_page_size: 100 #100 по умолчанию
      query:
        analysis:
          max_depth: 20
          max_complexity: 200
  rest:
    api:
      configs:
        alert:
          max_requests: 100
        push:
          max_requests: 100
  whmcs:
    credentials:
      identifier: ''
      secret: ''
    client:
      url: ''
      connect_timeout: 60000
      read_timeout: 60000
      write_timeout: 60000
      response_timeout: 60000
    data_sync:
      enabled: false # true по умолчанию
      schedulers:
        activity_log:
          enabled: true #true по умолчанию
          mode: 'NORMAL'  #NORMAL, FORCE_FIRST, ONLY_FIRST (NORMAL - по умолчанию)
          cron_expression: ''
          first_start:
            delays: [ 100, 200, 500, 1000, 10000, 50000, 100000 ] # список попыток и миллисекунды ожидания
            continue_after_error: true #true по умолчанию
          limit: 100  #100 по умолчанию
          skip_batch_error: false #по умолчанию false
          forbidden_description_patterns:
            - ''
            - ''
            - ''
          max_age_years: 3 #3 по умолчанию

        affiliate:
          enabled: true #true по умолчанию
