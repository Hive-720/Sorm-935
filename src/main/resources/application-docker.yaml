server:
  port: ${APP_PORT}

spring:
  application:
    name: ${APP_NAME}
  graphql:
    path: /query
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true
    websocket:
      path: /subscription
      connection-init-timeout: 10000s
      keep-alive: 3000000s
  r2dbc:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA}
    pool:
      enabled: true
      initial-size: 10
      max-idle-time: 1m
      max-size: 30
  liquibase:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    default-schema: ${POSTGRES_SCHEMA}