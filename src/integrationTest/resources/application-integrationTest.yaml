server:
  port: 0

spring:
  application:
    name: sorm-935
  graphql:
    path: /query
  r2dbc:
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
  liquibase:
    driver-class-name: org.postgresql.Driver
    default-schema: sorm_schema

management:
  server:
    port: 0

sorm:
  system:
    notifications:
      reload: false # не пушить стартовую нотификацию, чтобы не ломать ожидания по числу строк в БД
  graphql:
    schema:
      version_check:
        enabled: false # асинхронная проверка целостности схемы пишет в БД в фоне
                       # и гоняется с TRUNCATE между тестами (дедлок в PostgreSQL)
