server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sorm-server-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: sorm-server
          app: sorm-935
          __path__: /var/log/app/*.log
      - targets:
          - localhost
        labels:
          job: sorm-server
          app: sorm-935
          __path__: /var/log/app/*/*.log
    pipeline_stages:
      - json:
          expressions:
            app: app
            level: level
            logger: logger
            thread: thread
            message: message
            timestamp: '"@timestamp"'
      - labels:
          app:
          level:
          logger:
          thread:
      - timestamp:
          source: timestamp
          format: RFC3339
          action_on_failure: skip
